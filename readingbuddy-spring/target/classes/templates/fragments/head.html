<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Thymeleaf fragment — equivalent to Jinja2's {% block head %} inside base.html.
  Included via: <head th:replace="~{fragments/head :: head(title='Page Title')}">
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — ReadingBuddy'">ReadingBuddy</title>

    <!-- Bootstrap 5 CDN — replaces Tailwind / custom CSS from the Python version -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
</html>
