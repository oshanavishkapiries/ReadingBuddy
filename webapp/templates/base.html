<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReadingBuddy{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">ReadingBuddy</a>
            <div class="nav-links">
                <a href="/">Upload</a>
                <a href="/jobs">Jobs</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container">
            <p>ReadingBuddy - PDF to Sinhala Translation Pipeline</p>
        </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
