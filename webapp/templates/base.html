<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReadingBuddy{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">ReadingBuddy</a>
            <div class="nav-links">
                {% if user %}
                <a href="/dashboard">Dashboard</a>
                <a href="/documents">Documents</a>
                <a href="/jobs">Jobs</a>
                <a href="/explore">Explore</a>
                <a href="/settings">Settings</a>
                <a href="#" class="nav-user">{{ user.username }}</a>
                <form action="/logout" method="post" style="display:inline">
                    <button type="submit" class="btn btn-secondary" style="padding:0.3rem 0.6rem;font-size:0.8rem">Logout</button>
                </form>
                {% else %}
                <a href="/explore">Explore</a>
                <a href="/login">Login</a>
                <a href="/register">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container">
            <p>ReadingBuddy - PDF to Sinhala Translation Pipeline</p>
        </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
