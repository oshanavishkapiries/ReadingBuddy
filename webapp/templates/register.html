{% extends "base.html" %}

{% block title %}Register - ReadingBuddy{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Sign up to get started</p>

        <form action="/register" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus minlength="3">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{% if error %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    {% if error == "password_mismatch" %}
    Notify.error("Passwords do not match");
    {% elif error == "password_short" %}
    Notify.error("Password must be at least 6 characters");
    {% elif error == "username_taken" %}
    Notify.error("Username is already taken");
    {% elif error == "email_taken" %}
    Notify.error("Email is already registered");
    {% endif %}
});
</script>
{% endif %}
{% endblock %}
