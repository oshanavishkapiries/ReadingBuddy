spring.application.name=readingbuddy

# H2 file-based database — persists like SQLite in the Python version
spring.datasource.url=jdbc:h2:file:./readingbuddy;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate will create/update tables automatically (ddl-auto=update keeps data between restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console — useful for development (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# App-specific settings (same env vars as the Python version)
app.jwt.secret=readingbuddy-secret-change-in-production-must-be-32-chars
app.jwt.expiration-ms=604800000

app.workspace=./workspace
app.daily-limit=3

# OpenRouter API (used by the translation pipeline)
app.openrouter-api-key=
app.openrouter-model=openai/gpt-4o-mini
