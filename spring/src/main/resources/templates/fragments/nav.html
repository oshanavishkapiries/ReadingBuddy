<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Navigation fragment. Included via: <nav th:replace="~{fragments/nav :: nav}">
  currentUser is added to the model by AppConfig's ModelEnrichmentInterceptor — same pattern
  as Python passing "user" into every templates.TemplateResponse() call.
-->
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-book-half me-1"></i>ReadingBuddy
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <!-- sec:authorize is provided by thymeleaf-extras-springsecurity6 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/documents}">Documents</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/jobs}">Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/explore}">Explore</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <!-- th:if / th:unless replace Jinja2's {% if user %} -->
                <li class="nav-item" th:if="${currentUser != null}">
                    <a class="nav-link" th:href="@{/settings}">
                        <i class="bi bi-gear"></i>
                        <span th:text="${currentUser.username}">username</span>
                    </a>
                </li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-light ms-1">Logout</button>
                    </form>
                </li>
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Flash notification toast — replaces the Python rb_notify cookie + JS injection middleware -->
<div th:if="${notifyMessage != null}"
     class="position-fixed top-0 end-0 p-3" style="z-index:9999">
    <div id="notifyToast" class="toast show"
         th:classappend="${notifyType == 'success'} ? 'bg-success text-white'
                        : (${notifyType == 'warning'} ? 'bg-warning'
                        : 'bg-danger text-white')">
        <div class="toast-body" th:text="${notifyMessage}">message</div>
    </div>
</div>
</body>
</html>
