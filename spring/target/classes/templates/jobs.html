<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Jobs')}"></head>
<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<div class="container">
    <h5 class="mb-3">Translation Jobs</h5>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>File</th>
                    <th>Status</th>
                    <th>Progress</th>
                    <th>Created</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td>
                        <a th:href="@{/job/{id}(id=${job.id})}"
                           th:text="${job.filename}">file.pdf</a>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${job.status.name() == 'COMPLETED'} ? 'bg-success'
                                            : (${job.status.name() == 'FAILED'} ? 'bg-danger'
                                            : (${job.status.name() == 'CANCELLED'} ? 'bg-secondary'
                                            : 'bg-warning text-dark'))"
                              th:text="${job.status}">PENDING</span>
                    </td>
                    <td style="min-width:120px">
                        <div class="progress" style="height:6px">
                            <div class="progress-bar"
                                 th:style="'width:' + ${job.progress} + '%'"></div>
                        </div>
                    </td>
                    <td th:text="${#temporals.format(job.createdAt, 'MMM dd HH:mm')}">Jan 01 12:00</td>
                    <td>
                        <a th:href="@{/job/{id}(id=${job.id})}"
                           class="btn btn-sm btn-outline-secondary">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(jobs)}">
                    <td colspan="5" class="text-center text-muted py-4">No jobs yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
