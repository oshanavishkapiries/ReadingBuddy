<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Register')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<div class="container" style="max-width:420px">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-4">Create account</h4>

            <div th:if="${error}" class="alert alert-danger py-2">
                <span th:switch="${error}">
                    <span th:case="'password_mismatch'">Passwords do not match.</span>
                    <span th:case="'password_short'">Password must be at least 6 characters.</span>
                    <span th:case="'username_taken'">Username is already taken.</span>
                    <span th:case="'email_taken'">Email is already in use.</span>
                    <span th:case="*">Registration failed. Please try again.</span>
                </span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm password</label>
                    <input type="password" name="confirmPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Already have an account? <a th:href="@{/login}">Login</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
